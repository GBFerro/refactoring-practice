name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The value of this repository is that main is always pristine and green.
      - name: Metadata and generated files
        run: |
          npm run validate
          npm run index -- --check

      - name: Baseline is green
        run: npm test

      - name: Every solution passes the same suite
        run: npm run test:solutions

      - name: Safety nets cover what the katas will move
        run: npm run test:coverage

      - name: Solutions meet the strict bar
        run: npm run lint:solutions

      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Types
        run: npm run typecheck
